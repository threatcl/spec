name: release

# Cut a release by pushing a signed tag:  git tag -s vX.Y.Z -m vX.Y.Z && git push --tags
on:
  push:
    tags:
      - 'v*'

# Least privilege by default; the release job escalates only what it needs.
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the GitHub Release and upload assets
      id-token: write      # OIDC token for Sigstore signing of provenance
      attestations: write  # store the build-provenance attestation
    steps:
      - name: Harden runner (egress block)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            api.github.com:443
            codeload.github.com:443
            dl.google.com:443
            fulcio.sigstore.dev:443
            get.anchore.io:443
            github.com:443
            go.dev:443
            objects.githubusercontent.com:443
            proxy.golang.org:443
            raw.githubusercontent.com:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            storage.googleapis.com:443
            sum.golang.org:443
            toolbox-data.anchore.io:443
            tuf-repo-cdn.sigstore.dev:443
            uploads.github.com:443

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Build deterministic source archive
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          # Guard: the pushed tag must match version.go (via the Makefile's
          # existing version logic — no duplication of where the version lives).
          GO_VERSION="$(make version)"
          if [ "${GO_VERSION}" != "${VERSION}" ]; then
            echo "::error::tag ${TAG} (=> ${VERSION}) does not match version.go (${GO_VERSION}); bump version.go before tagging"
            exit 1
          fi
          PREFIX="spec-${VERSION}"
          # Reproducible archive: git archive uses fixed (commit-time) mtimes and
          # gzip -n drops the timestamp/name, so the bytes are reproducible.
          git archive --format=tar --prefix="${PREFIX}/" HEAD | gzip -9 -n > "${PREFIX}.tar.gz"
          echo "ARCHIVE=${PREFIX}.tar.gz" >> "${GITHUB_ENV}"
          echo "SBOM=${PREFIX}.spdx.json" >> "${GITHUB_ENV}"

      # SPDX SBOM of the Go module tree (syft reads go.mod/go.sum): a static
      # inventory of what this release depends on, so CVEs disclosed later can
      # be matched against historical releases without rebuilding them.
      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: ${{ env.SBOM }}
          upload-artifact: false
          upload-release-assets: false

      - name: Checksums
        run: |
          set -euo pipefail
          sha256sum "${ARCHIVE}" "${SBOM}" > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            spec-*.tar.gz
            spec-*.spdx.json
            SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            "${ARCHIVE}" "${SBOM}" SHA256SUMS \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
