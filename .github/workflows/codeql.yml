# CodeQL SAST over the Go source. This repo deliberately runs CodeQL as its
# single Go SAST tool (instead of adding e.g. gosec alongside): the
# security-extended suite covers most of what gosec would add, with
# interprocedural dataflow and fewer false positives — a second tool would
# mostly double the triage noise.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '25 10 * * 2'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (go)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      security-events: write # upload CodeQL results to code scanning
      packages: read # fetch CodeQL query packs
      contents: read
    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: go
          build-mode: autobuild
          queries: security-extended
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          category: "/language:go"
